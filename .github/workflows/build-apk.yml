name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Verify source files
        run: |
          echo "=== PermissionHelper.kt (line 45-75) ==="
          sed -n '45,75p' android/app/src/main/java/com/ysdev/floatingrecorder/PermissionHelper.kt
          echo ""
          echo "=== Check for dangerous expression bodies ==="
          grep -n 'fun .* = $' android/app/src/main/java/com/ysdev/floatingrecorder/*.kt || echo "OK: no multi-line expression bodies"

      - name: Deep clean
        run: |
          rm -rf ~/.gradle/caches ~/.gradle/daemon
          find . -name "build" -type d -exec rm -rf {} + 2>/dev/null || true
          find . -name ".gradle" -type d -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.class" -delete 2>/dev/null || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew clean --no-daemon
          ./gradlew assembleDebug --no-daemon --no-build-cache --rerun-tasks --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn
